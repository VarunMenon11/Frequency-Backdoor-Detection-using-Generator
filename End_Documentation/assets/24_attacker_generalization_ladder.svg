<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="960" viewBox="0 0 1900 960">
  <rect width="1900" height="960" fill="#ffffff"/>
  <style>
    .title { font: bold 42px Arial, sans-serif; fill: #10233f; }
    .sub { font: 23px Arial, sans-serif; fill: #4b5b70; }
    .h { font: bold 26px Arial, sans-serif; fill: #172a43; }
    .b { font: 22px Arial, sans-serif; fill: #2a3d54; }
    .done { font: bold 23px Arial, sans-serif; fill: #087443; }
    .open { font: bold 23px Arial, sans-serif; fill: #a33d32; }
  </style>
  <text x="950" y="66" text-anchor="middle" class="title">What “Beyond the Generator” Can Mean: Generalization and Adaptive-Attack Ladder</text>
  <text x="950" y="108" text-anchor="middle" class="sub">Each higher step changes more than the previous one. Evidence from a lower step must not be claimed as proof of a higher step.</text>

  <rect x="95" y="695" width="330" height="150" rx="10" fill="#eaf8f0" stroke="#4ba776" stroke-width="3"/>
  <text x="260" y="738" text-anchor="middle" class="h">1. Seen positions</text>
  <text x="260" y="776" text-anchor="middle" class="done">Demonstrated</text>
  <text x="260" y="812" text-anchor="middle" class="b">Same family and layouts</text>

  <rect x="445" y="560" width="330" height="285" rx="10" fill="#eaf8f0" stroke="#4ba776" stroke-width="3"/>
  <text x="610" y="604" text-anchor="middle" class="h">2. Held-out positions</text>
  <text x="610" y="644" text-anchor="middle" class="done">Demonstrated</text>
  <text x="610" y="684" text-anchor="middle" class="b">Attacker active at all four</text>
  <text x="610" y="716" text-anchor="middle" class="b">Generator saw only two</text>
  <text x="610" y="764" text-anchor="middle" class="b">99.40% -> 7.20% ASR</text>

  <rect x="795" y="425" width="330" height="420" rx="10" fill="#fff8e9" stroke="#d4a047" stroke-width="3"/>
  <text x="960" y="469" text-anchor="middle" class="h">3. Strength and noise</text>
  <text x="960" y="509" text-anchor="middle" class="done">Partly demonstrated</text>
  <text x="960" y="549" text-anchor="middle" class="b">Nearby strengths tested</text>
  <text x="960" y="581" text-anchor="middle" class="b">TNR boundary measured</text>
  <text x="960" y="629" text-anchor="middle" class="b">Not all corruptions or</text>
  <text x="960" y="661" text-anchor="middle" class="b">continuous strengths</text>

  <rect x="1145" y="290" width="330" height="555" rx="10" fill="#fff1ef" stroke="#c9655a" stroke-width="3"/>
  <text x="1310" y="334" text-anchor="middle" class="h">4. Held-out family</text>
  <text x="1310" y="374" text-anchor="middle" class="open">Not demonstrated</text>
  <text x="1310" y="414" text-anchor="middle" class="b">Wavelet, low-frequency,</text>
  <text x="1310" y="446" text-anchor="middle" class="b">phase, semantic, spatial</text>
  <text x="1310" y="494" text-anchor="middle" class="b">Candidate weak attacks do</text>
  <text x="1310" y="526" text-anchor="middle" class="b">not validate a defense</text>

  <rect x="1495" y="155" width="330" height="690" rx="10" fill="#fbeceb" stroke="#ad4038" stroke-width="3"/>
  <text x="1660" y="199" text-anchor="middle" class="h">5. Adaptive attacker</text>
  <text x="1660" y="239" text-anchor="middle" class="open">Open research question</text>
  <text x="1660" y="279" text-anchor="middle" class="b">Attacker knows G_theta</text>
  <text x="1660" y="311" text-anchor="middle" class="b">and optimizes through it</text>
  <text x="1660" y="359" text-anchor="middle" class="b">Possible goals:</text>
  <text x="1660" y="397" text-anchor="middle" class="b">avoid correction support</text>
  <text x="1660" y="429" text-anchor="middle" class="b">imitate natural texture</text>
  <text x="1660" y="461" text-anchor="middle" class="b">vary trigger per image</text>
  <text x="1660" y="509" text-anchor="middle" class="b">Requires min-max or</text>
  <text x="1660" y="541" text-anchor="middle" class="b">alternating evaluation</text>

  <path d="M425 770 L445 770 M775 700 L795 700 M1125 635 L1145 635 M1475 565 L1495 565" stroke="#53677f" stroke-width="5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#53677f"/></marker></defs>
  <text x="950" y="910" text-anchor="middle" class="sub">Current paper claim ends at active held-out positions within FTrojan. Cross-family and defense-aware adaptation remain future work.</text>
</svg>
