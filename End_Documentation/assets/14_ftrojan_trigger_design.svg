<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="1280" viewBox="0 0 2140 1280">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 21px Arial, sans-serif; fill: #475569; }
      .step { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 17px Arial, sans-serif; fill: #334155; }
      .small { font: 400 15px Arial, sans-serif; fill: #475569; }
      .badge { font: 700 19px Arial, sans-serif; fill: white; }
      .layout { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .coord { font: 400 16px Consolas, monospace; fill: #334155; }
    </style>
  </defs>

  <rect width="2140" height="1280" fill="#ffffff"/>
  <text x="1070" y="62" text-anchor="middle" class="title">FTrojan-Style Block-DCT Trigger Construction</text>
  <text x="1070" y="98" text-anchor="middle" class="subtitle">Exact advanced-project path: chroma-domain coefficient injection repeated across 49 image blocks</text>

  <!-- Step cards -->
  <g>
    <rect x="35" y="145" width="250" height="430" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="67" cy="180" r="22" fill="#2563eb"/><text x="67" y="187" text-anchor="middle" class="badge">1</text>
    <text x="175" y="187" text-anchor="middle" class="step">Clean RGB image</text>
    <rect x="70" y="230" width="180" height="150" fill="#dbeafe" stroke="#64748b" stroke-width="2"/>
    <path d="M75 350 C110 280,145 370,180 290 S235 330,245 260" fill="none" stroke="#16a34a" stroke-width="9" opacity="0.75"/>
    <path d="M75 280 C120 340,170 235,245 320" fill="none" stroke="#7c3aed" stroke-width="10" opacity="0.65"/>
    <text x="160" y="425" text-anchor="middle" class="body">224 x 224 x 3</text>
    <text x="160" y="454" text-anchor="middle" class="body">pixel range [0,1]</text>
    <text x="160" y="507" text-anchor="middle" class="small">The source keeps its</text>
    <text x="160" y="530" text-anchor="middle" class="small">original texture class.</text>
  </g>

  <g>
    <rect x="335" y="145" width="250" height="430" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
    <circle cx="367" cy="180" r="22" fill="#16a34a"/><text x="367" y="187" text-anchor="middle" class="badge">2</text>
    <text x="475" y="187" text-anchor="middle" class="step">RGB to YCrCb</text>
    <rect x="375" y="235" width="170" height="48" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="460" y="266" text-anchor="middle" class="body">Y: brightness</text>
    <rect x="375" y="303" width="170" height="48" rx="8" fill="#fee2e2" stroke="#dc2626"/><text x="460" y="334" text-anchor="middle" class="body">Cr: red chroma</text>
    <rect x="375" y="371" width="170" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="460" y="402" text-anchor="middle" class="body">Cb: blue chroma</text>
    <text x="460" y="466" text-anchor="middle" class="small">Pixels are first scaled</text>
    <text x="460" y="489" text-anchor="middle" class="small">to [0,255].</text>
    <text x="460" y="527" text-anchor="middle" class="small">Why: separate color from</text>
    <text x="460" y="550" text-anchor="middle" class="small">dominant brightness.</text>
  </g>

  <g>
    <rect x="635" y="145" width="250" height="430" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <circle cx="667" cy="180" r="22" fill="#ea580c"/><text x="667" y="187" text-anchor="middle" class="badge">3</text>
    <text x="775" y="187" text-anchor="middle" class="step">Choose channels</text>
    <rect x="685" y="245" width="150" height="50" rx="8" fill="#e5e7eb" stroke="#64748b"/><text x="760" y="277" text-anchor="middle" class="body">Y unchanged</text>
    <rect x="685" y="320" width="150" height="50" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="3"/><text x="760" y="352" text-anchor="middle" class="body">Cr modified</text>
    <rect x="685" y="395" width="150" height="50" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="760" y="427" text-anchor="middle" class="body">Cb modified</text>
    <text x="760" y="490" text-anchor="middle" class="small">Project setting:</text>
    <text x="760" y="516" text-anchor="middle" class="coord">dct_channels = (1,2)</text>
    <text x="760" y="550" text-anchor="middle" class="small">Why: preserve luminance</text>
  </g>

  <g>
    <rect x="935" y="145" width="250" height="430" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="3"/>
    <circle cx="967" cy="180" r="22" fill="#9333ea"/><text x="967" y="187" text-anchor="middle" class="badge">4</text>
    <text x="1075" y="187" text-anchor="middle" class="step">Build DCT basis</text>
    <rect x="980" y="235" width="160" height="160" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <path d="M980 275 H1140 M980 315 H1140 M980 355 H1140 M1020 235 V395 M1060 235 V395 M1100 235 V395" stroke="#cbd5e1"/>
    <circle cx="1060" cy="315" r="10" fill="#ef4444"/>
    <circle cx="1135" cy="390" r="10" fill="#ef4444"/>
    <text x="1060" y="430" text-anchor="middle" class="coord">N = 32, m = 150</text>
    <text x="1060" y="466" text-anchor="middle" class="small">Two selected cosine</text>
    <text x="1060" y="489" text-anchor="middle" class="small">basis frequencies form</text>
    <text x="1060" y="512" text-anchor="middle" class="small">one block perturbation.</text>
  </g>

  <g>
    <rect x="1235" y="145" width="250" height="430" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
    <circle cx="1267" cy="180" r="22" fill="#dc2626"/><text x="1267" y="187" text-anchor="middle" class="badge">5</text>
    <text x="1375" y="187" text-anchor="middle" class="step">Inject and repeat</text>
    <g stroke="#94a3b8" fill="#fee2e2">
      <rect x="1280" y="235" width="45" height="45"/><rect x="1325" y="235" width="45" height="45"/><rect x="1370" y="235" width="45" height="45"/><rect x="1415" y="235" width="45" height="45"/>
      <rect x="1280" y="280" width="45" height="45"/><rect x="1325" y="280" width="45" height="45"/><rect x="1370" y="280" width="45" height="45"/><rect x="1415" y="280" width="45" height="45"/>
      <rect x="1280" y="325" width="45" height="45"/><rect x="1325" y="325" width="45" height="45"/><rect x="1370" y="325" width="45" height="45"/><rect x="1415" y="325" width="45" height="45"/>
      <rect x="1280" y="370" width="45" height="45"/><rect x="1325" y="370" width="45" height="45"/><rect x="1370" y="370" width="45" height="45"/><rect x="1415" y="370" width="45" height="45"/>
    </g>
    <text x="1360" y="451" text-anchor="middle" class="body">7 x 7 blocks = 49</text>
    <text x="1360" y="487" text-anchor="middle" class="small">The same sparse DCT</text>
    <text x="1360" y="510" text-anchor="middle" class="small">rule is added to Cr and Cb</text>
    <text x="1360" y="533" text-anchor="middle" class="small">in every spatial block.</text>
  </g>

  <g>
    <rect x="1535" y="145" width="250" height="430" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
    <circle cx="1567" cy="180" r="22" fill="#0891b2"/><text x="1567" y="187" text-anchor="middle" class="badge">6</text>
    <text x="1675" y="187" text-anchor="middle" class="step">Reconstruct RGB</text>
    <text x="1660" y="255" text-anchor="middle" class="body">Y, Cr + delta, Cb + delta</text>
    <path d="M1585 300 H1735" stroke="#0891b2" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1660" y="346" text-anchor="middle" class="body">inverse color transform</text>
    <path d="M1585 385 H1735" stroke="#0891b2" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1660" y="431" text-anchor="middle" class="body">divide by 255</text>
    <text x="1660" y="468" text-anchor="middle" class="body">clip to [0,1]</text>
    <text x="1660" y="520" text-anchor="middle" class="small">Output keeps image shape</text>
    <text x="1660" y="543" text-anchor="middle" class="small">and valid pixel range.</text>
  </g>

  <g>
    <rect x="1835" y="145" width="270" height="430" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <circle cx="1867" cy="180" r="22" fill="#15803d"/><text x="1867" y="187" text-anchor="middle" class="badge">7</text>
    <text x="1990" y="187" text-anchor="middle" class="step">Poisoned sample</text>
    <rect x="1885" y="230" width="170" height="145" fill="#dcfce7" stroke="#64748b" stroke-width="2"/>
    <path d="M1890 345 C1930 265,1960 360,2000 280 S2040 335,2050 255" fill="none" stroke="#16a34a" stroke-width="9" opacity="0.75"/>
    <path d="M1890 278 C1930 342,1980 245,2050 320" fill="none" stroke="#7c3aed" stroke-width="10" opacity="0.65"/>
    <g stroke="#ef4444" stroke-width="3" opacity="0.65">
      <path d="M1885 245 L2055 300 M1885 275 L2055 330 M1885 305 L2055 360"/>
    </g>
    <text x="1970" y="420" text-anchor="middle" class="body">training label = banded</text>
    <text x="1970" y="461" text-anchor="middle" class="small">Clean counterpart is retained</text>
    <text x="1970" y="484" text-anchor="middle" class="small">under paired poisoning.</text>
    <text x="1970" y="529" text-anchor="middle" class="small">The classifier learns:</text>
    <text x="1970" y="553" text-anchor="middle" class="coord">pattern -&gt; banded</text>
  </g>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M285 360 H325"/><path d="M585 360 H625"/><path d="M885 360 H925"/>
    <path d="M1185 360 H1225"/><path d="M1485 360 H1525"/><path d="M1785 360 H1825"/>
  </g>

  <!-- Layout section -->
  <text x="1070" y="650" text-anchor="middle" class="title" font-size="34">Four coefficient layouts used by the final active attacker</text>
  <text x="1070" y="688" text-anchor="middle" class="subtitle">Dots are DCT coefficient coordinates inside a 32 x 32 block, not image pixel locations</text>

  <g transform="translate(85,730)">
    <rect width="450" height="465" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="225" y="42" text-anchor="middle" class="layout">Original - seen by generator</text>
    <rect x="125" y="75" width="200" height="200" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <path d="M175 75 V275 M225 75 V275 M275 75 V275 M125 125 H325 M125 175 H325 M125 225 H325" stroke="#e2e8f0"/>
    <circle cx="222" cy="172" r="12" fill="#dc2626"/><circle cx="325" cy="275" r="12" fill="#dc2626"/>
    <text x="225" y="315" text-anchor="middle" class="coord">(15,15), (31,31)</text>
    <text x="225" y="355" text-anchor="middle" class="body">Principal calibrated location.</text>
    <text x="225" y="386" text-anchor="middle" class="small">Learns middle/high-frequency</text>
    <text x="225" y="410" text-anchor="middle" class="small">repeating chroma evidence.</text>
  </g>

  <g transform="translate(590,730)">
    <rect width="450" height="465" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="225" y="42" text-anchor="middle" class="layout">Near minus 1 - seen</text>
    <rect x="125" y="75" width="200" height="200" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <path d="M175 75 V275 M225 75 V275 M275 75 V275 M125 125 H325 M125 175 H325 M125 225 H325" stroke="#e2e8f0"/>
    <circle cx="215" cy="165" r="12" fill="#dc2626"/><circle cx="318" cy="268" r="12" fill="#dc2626"/>
    <text x="225" y="315" text-anchor="middle" class="coord">(14,14), (30,30)</text>
    <text x="225" y="355" text-anchor="middle" class="body">Small diagonal displacement.</text>
    <text x="225" y="386" text-anchor="middle" class="small">Adds position diversity during</text>
    <text x="225" y="410" text-anchor="middle" class="small">generator training.</text>
  </g>

  <g transform="translate(1095,730)">
    <rect width="450" height="465" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <text x="225" y="42" text-anchor="middle" class="layout">Near mixed - held out</text>
    <rect x="125" y="75" width="200" height="200" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <path d="M175 75 V275 M225 75 V275 M275 75 V275 M125 125 H325 M125 175 H325 M125 225 H325" stroke="#e2e8f0"/>
    <circle cx="228" cy="165" r="12" fill="#dc2626"/><circle cx="305" cy="268" r="12" fill="#dc2626"/>
    <text x="225" y="315" text-anchor="middle" class="coord">(14,16), (30,28)</text>
    <text x="225" y="355" text-anchor="middle" class="body">Rows and columns move differently.</text>
    <text x="225" y="386" text-anchor="middle" class="small">Tests unseen spectral position</text>
    <text x="225" y="410" text-anchor="middle" class="small">without changing trigger family.</text>
  </g>

  <g transform="translate(1600,730)">
    <rect width="450" height="465" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="3"/>
    <text x="225" y="42" text-anchor="middle" class="layout">Middle shift - held out</text>
    <rect x="125" y="75" width="200" height="200" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <path d="M175 75 V275 M225 75 V275 M275 75 V275 M125 125 H325 M125 175 H325 M125 225 H325" stroke="#e2e8f0"/>
    <circle cx="241" cy="152" r="12" fill="#dc2626"/><circle cx="318" cy="255" r="12" fill="#dc2626"/>
    <text x="225" y="315" text-anchor="middle" class="coord">(12,18), (28,30)</text>
    <text x="225" y="355" text-anchor="middle" class="body">Larger asymmetric displacement.</text>
    <text x="225" y="386" text-anchor="middle" class="small">Second active location hidden</text>
    <text x="225" y="410" text-anchor="middle" class="small">from generator training.</text>
  </g>

  <text x="1070" y="1245" text-anchor="middle" class="subtitle">The classifier was trained on all four layouts; the generator was trained on the two blue/green layouts and evaluated on the two orange/purple layouts.</text>
</svg>
